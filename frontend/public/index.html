<!DOCTYPE html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.png?v=3" type="image/png" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=3" sizes="any" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#4A0E1F" />
    <meta
      name="description"
      content="Aurevia - anti-tarnish fashion jewellery and curated gift boxes. Anti-tarnish AD and crystal designs from ₹449 with cash on delivery across India."
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=3" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- First hero slide: start downloading before the app script runs. -->
    <link rel="preload" as="image" href="%PUBLIC_URL%/images/hero/hero-3.webp" fetchpriority="high" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>Aurevia | Fashion Jewellery & Gifts</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <!-- NimbusPost "Track your order" widget (floating button; opens aurevia.nmbus.co/track/<AWB>).
         Styled to match the store, moved bottom-left so it doesn't cover the WhatsApp button, and made phone-friendly. -->
    <style>
      .track-button-nib { left: 20px !important; right: auto !important; bottom: 20px !important; z-index: 40; cursor: pointer;
        font: 600 12px/1 Manrope, system-ui, sans-serif !important; letter-spacing: .12em; text-transform: uppercase;
        padding: 12px 16px !important; border-radius: 999px !important; box-shadow: 0 6px 18px rgba(74,14,31,.25); }
      .track-button-nib img { width: 16px; height: 16px; top: 3px !important; margin-right: 4px; filter: brightness(0) invert(1); }
      .order-ship-box-outside-nib { z-index: 60 !important; }
      .order-ship-box-nib { width: min(440px, calc(100vw - 32px)) !important; padding: 28px 20px !important; border-radius: 12px !important; font-family: Manrope, system-ui, sans-serif; }
      .order-ship-box-nib h1 { font: 500 30px/1.2 "Cormorant Garamond", serif !important; margin-bottom: 20px !important; }
      .order-ship-box-nib .search-input-wrp-nib { border-radius: 8px; }
      .order-ship-box-nib .search-button-wrp-nib { border-radius: 8px; letter-spacing: .1em; text-transform: uppercase; font-size: 12px; font-weight: 600; }
      @media (max-width: 640px) { .track-button-nib { bottom: 16px !important; left: 16px !important; } }
    </style>
    <script>
      window.addEventListener("DOMContentLoaded", function () {
        var css = document.createElement("link");
        css.setAttribute("rel", "stylesheet");
        css.setAttribute("href", "https://app.nimbuspost.com/tracking-widget/nimbus_order_track.css");
        document.body.appendChild(css);

        var js = document.createElement("script");
        js.setAttribute("onload", "nimbusTrackStyle()");
        js.setAttribute("src", "https://app.nimbuspost.com/tracking-widget/nimbus_order_track.js");
        js.setAttribute("subdom", "aurevia");
        document.body.appendChild(js);
      });

      // Brand colours; each element is checked first so a widget update can't break the page.
      function nimbusTrackStyle() {
        var burgundy = "#4A0E1F", set = function (sel, fn) { var el = document.querySelector(sel); if (el) fn(el); };
        set(".track-button-nib", function (el) { el.style.background = burgundy; el.style.color = "#ffffff"; });
        set(".order-ship-box-nib", function (el) { el.style.backgroundColor = "#FCFCFA"; });
        set(".order-ship-box-nib h1", function (el) { el.style.color = burgundy; });
        set(".search-input-wrp-nib", function (el) { el.style.backgroundColor = "#ffffff"; });
        set("#input_search", function (el) { el.style.setProperty("--c", "#1c1917"); el.style.color = "#1c1917"; });
        set(".search-button-wrp-nib", function (el) { el.style.backgroundColor = burgundy; el.style.color = "#ffffff"; });
      }
    </script>
  </body>
</html>
